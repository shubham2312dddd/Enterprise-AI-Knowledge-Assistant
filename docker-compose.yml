services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: knowledge-assistant-backend:1.0
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_DB_PATH: /app/backend/vector_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - knowledge_assistant_data:/app/backend/vector_db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: knowledge-assistant-frontend:1.0
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    # Dockerfile.frontend bakes VITE_API_BASE_URL=http://localhost:8000 into the bundle.

volumes:
  knowledge_assistant_data:
    external: true
    name: knowledge_assistant_data
